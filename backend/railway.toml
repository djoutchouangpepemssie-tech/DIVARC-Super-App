# Configuration de déploiement Railway — Backend Python DIVARC (FastAPI)
# À utiliser sur un service Railway dont le "Root Directory" = backend/

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Pas de startCommand ici : Railway l'exécuterait sans shell et n'interpréterait pas ${PORT}.
# On laisse le CMD du Dockerfile (qui passe par `sh -c` et gère ${PORT}) faire le démarrage.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/api/health"
healthcheckTimeout = 120
