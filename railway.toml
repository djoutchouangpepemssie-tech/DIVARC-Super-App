# Configuration Railway — Service FRONTEND (Next.js). Root Directory = / (racine).
# Le backend Python a sa propre config dans backend/railway.toml.
# Ce service a besoin de la variable BACKEND_URL (URL du service api) pour le proxy /api/*.
# Docs : https://docs.railway.com/reference/config-as-code

[build]
builder = "NIXPACKS"
# Build déterministe avec npm (voir nixpacks.toml : npm ci + npm run build, Node 20).
# Le repo est géré par npm (package-lock.json) ; on n'utilise plus yarn pour éviter les
# échecs de résolution après ajout de dépendances.

[deploy]
# `npm run start` lance `next start -H 0.0.0.0` ; Next lit la variable PORT injectée par Railway.
startCommand = "npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
